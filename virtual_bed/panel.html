<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Virtual bed · TextileSense Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4ef;color:#203a38;font:16px/1.5 system-ui,sans-serif}
main{display:grid;max-width:1250px;margin:auto;grid-template-columns:minmax(320px,1fr) minmax(340px,.8fr);min-height:100vh}
section{padding:clamp(20px,4vw,50px)}h1{font-size:clamp(32px,4vw,54px);line-height:1.05;margin:8px 0 15px;letter-spacing:-1.8px}h2{font-size:20px;margin:28px 0 8px}
p{margin:8px 0 16px}.brand{font-weight:700;color:#22696c}button,a{font:inherit}button{border:1px solid #a9bbb4;background:#fff;color:#234342;border-radius:8px;padding:9px 14px;cursor:pointer}
button[aria-pressed=true],#toggle{background:#155d62;color:#fff}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
code,pre{font:14px/1.5 ui-monospace,monospace}pre{background:#e3eae4;border-radius:9px;padding:12px;white-space:pre-wrap}
a{color:#185b68}iframe{background:#0b1925;border:0;width:100%;height:100vh;min-height:780px;position:sticky;top:0}summary{cursor:pointer}#error{color:#9b3030}
@media(max-width:740px){main{display:block}iframe{position:static;min-height:900px}}
</style></head><body><main><section><div class="brand">TextileSense Live</div><h1>Virtual bed</h1><p>Choose how the person lies on the bed. The virtual mat generates 2,048 pressure values each second.</p>
<h2>Person on the mat</h2><div id="poses" class="controls"><button data-action="empty">Get up</button><button data-action="back">Lie on back</button><button data-action="left">Turn left</button><button data-action="right">Turn right</button></div>
<div class="controls"><button id="toggle" data-action="start">Start sensor</button></div><span id="status">Connecting…</span><p id="error" role="alert"></p>
<h2>Inside Firestore</h2><code>sessions/virtual-bed/state/latest</code>
<pre id="doc">Waiting for the first document</pre>
<details><summary>Inspect one sensor cell</summary><label>Row (0–31) <input type="number" id="r" min="0" max="31" value="15"></label> <label>Column (0–63) <input type="number" id="c" min="0" max="63" value="34"></label><p id="cell"></p></details>
<p><a href="/console" target="_blank" rel="noopener">Open Firestore database ↗</a></p></section><iframe title="Live Expo dashboard" src="/monitor"></iframe></main>
<script>
const el=id=>document.getElementById(id);
let last=null;
function cell(){const r=el('r').valueAsNumber,c=el('c').valueAsNumber;
 el('cell').textContent=last&&Number.isInteger(r)&&Number.isInteger(c)&&r>=0&&r<32&&c>=0&&c<64?'Sensor ['+r+', '+c+'] = '+last.values[r*64+c]+' simulated counts':''}
async function refresh(){const response=await fetch('/reading',{cache:'no-store'});if(!response.ok)throw Error('Firestore read failed.');const s=await response.json();last=s.document;
 el('error').textContent=s.error;el('toggle').textContent=s.remaining?'Pause sensor':'Start sensor';el('toggle').dataset.action=s.remaining?'pause':'start';
 el('status').textContent=s.remaining?'Streaming · '+s.remaining+' frames left in this run':'Sensor paused';
 for(const b of document.querySelectorAll('#poses button'))b.setAttribute('aria-pressed',String(b.dataset.action===s.pose));
 if(last)el('doc').textContent=['Frame       '+last.frame_id,'Source      '+last.source,'Scenario    '+last.scenario,'Peak        '+Math.max(...last.values)+' simulated counts','Cells       '+last.values.length,'Result      '+last.prediction,'Captured    '+new Date(last.captured_ms).toISOString()].join('\n');
 cell()}
document.addEventListener('click',async e=>{const a=e.target.dataset.action;if(!a)return;
 try{const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a})});if(!r.ok)throw Error('Control request failed.');await refresh()}catch(err){el('error').textContent=String(err)}});
el('r').oninput=el('c').oninput=cell;
async function poll(){try{await refresh()}catch(e){el('error').textContent='Reading unavailable. Last displayed values may be old.'}setTimeout(poll,600)}poll();
</script></body></html>
